<style>
:root{--ink:#20252b;--muted:#68727d;--line:#e6e9ed;--green:#269b65;--blue:#3285d5;--paper:#fff;--bg:#f5f7f8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:17px 20px 13px}
h1{font-size:20px;margin:0 0 4px;font-weight:750;letter-spacing:-.5px}.sub{font-size:12px;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(310px,390px) 1fr;height:calc(100dvh - 75px);min-height:520px}
aside{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tools{padding:13px;border-bottom:1px solid var(--line)}
input[type=search]{width:100%;padding:11px 12px;border:1px solid #dfe3e7;border-radius:9px;font:inherit;font-size:14px;outline:none}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.filter{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 10px;font-size:12px;color:#4c5661;cursor:pointer}
.filter.active{background:#20252b;color:#fff;border-color:#20252b}
.legend{display:flex;gap:14px;margin-top:11px;font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.dot.done{background:var(--green)}.dot.plan{background:var(--blue)}
.count{padding:10px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
#list{overflow:auto;min-height:0}
.item{padding:12px 14px;border-bottom:1px solid #f0f1f3;cursor:pointer}
.item:hover,.item.selected{background:#f6f8fa}
.itemtop{display:flex;align-items:flex-start;gap:8px}.pin{width:9px;height:9px;flex:0 0 9px;border-radius:50%;margin-top:6px}
.item h3{font-size:13px;line-height:1.45;margin:0;font-weight:700}.meta{font-size:11px;color:var(--muted);line-height:1.55;margin:4px 0 0 17px}
.rating{color:#b17a16;font-size:11px;white-space:nowrap;margin-left:auto}
#map{height:100%;width:100%;background:#e9edf0}
.leaflet-container{font-family:inherit}
.marker{width:16px;height:16px;border:2px solid white;border-radius:50%;box-shadow:0 1px 5px #0004}
.marker.done{background:var(--green)}.marker.plan{background:var(--blue)}
.leaflet-popup-content-wrapper{border-radius:10px}.leaflet-popup-content{margin:12px 14px;min-width:190px}
.pop-title{font-size:13px;font-weight:750;margin-bottom:5px}.pop-small{font-size:11px;color:#66717d;line-height:1.5}
#status{position:absolute;z-index:500;top:90px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:11px;box-shadow:0 2px 10px #0001;color:#59636e}
footer{font-size:10px;color:#7b858f;padding:9px 13px;border-top:1px solid var(--line);background:#fff}
@media(max-width:720px){header{padding:12px 14px}h1{font-size:18px}main{display:flex;flex-direction:column;height:calc(100dvh - 66px);min-height:0}#map{height:48%;min-height:250px;order:1}aside{height:52%;order:2;border-right:0}.tools{padding:9px 12px}.item{padding:9px 12px}#status{top:78px}}
</style>
</head>

const map=L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([37.55,126.98],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}).addTo(map);
let markers=[],currentFilter='all',query='',active=null;
const status=document.getElementById('status'),list=document.getElementById('list');
function icon(state){return L.divIcon({className:'',html:`<div class="marker ${state}"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}
function visible(x){return (currentFilter==='all'||currentFilter===x.state||(currentFilter==='free'&&x.fee==='무료')) && (query===''||(x.title+x.venue+x.address+x.note).toLowerCase().includes(query))}
function popup(x){return `<div class="pop-title">${x.title}</div><div class="pop-small">${x.venue}<br>종료: ${x.end} · ${x.fee}<br>${x.rating} ${x.state==='done'?'관람 후 평가':'관람 전 평가'}<br><br>${x.note}</div>`}
function render(){
 list.innerHTML='';let shown=exhibitions.filter(visible);
 document.getElementById('count').textContent=`전시 ${shown.length}개 · 장소 ${new Set(shown.map(x=>x.venue)).size}곳`;
 shown.forEach(x=>{
  const el=document.createElement('div');el.className='item'+(active===x?' selected':'');
  el.innerHTML=`<div class="itemtop"><span class="pin" style="background:${x.state==='done'?'var(--green)':'var(--blue)'}"></span><h3>${x.title}</h3><span class="rating">${x.rating}</span></div><div class="meta">${x.venue} · ~ ${x.end}<br>${x.fee}</div>`;
  el.onclick=()=>{active=x;const m=markers.find(a=>a.x===x);if(m){map.setView(m.marker.getLatLng(),15);m.marker.openPopup()}render()};
  list.appendChild(el);
 });
 markers.forEach(o=>{if(visible(o.x))o.marker.addTo(map);else map.removeLayer(o.marker)});
}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(q=>q.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
// 주소 기반 위치의 초기 배치 좌표입니다. 장소별 정확한 출입구 좌표는 공개 웹 배포 단계에서 검증·보정합니다.
function approximateCoord(v){
 const a=v.address;
 if(a.includes('과천시')) return [37.4315,127.0195];
 if(a.includes('안양시')) return [37.4215,126.925];
 if(a.includes('도봉구')) return [37.653,127.052];
 if(a.includes('송파구')) return [37.509,127.101];
 if(a.includes('서초구')) return [37.480,127.012];
 if(a.includes('영등포구')) return [37.519,126.940];
 if(a.includes('강남구')) return [37.525,127.039];
 if(a.includes('성북구')) return [37.590,127.003];
 if(a.includes('마포구')) return [37.546,126.916];
 if(a.includes('중구')) return [37.565,126.977];
 if(a.includes('서대문구')) return [37.567,126.930];
 if(a.includes('용산구')) return [37.534,126.994];
 if(a.includes('종로구') && (a.includes('평창')||a.includes('자하문'))) return [37.601,126.967];
 if(a.includes('종로구') && (a.includes('삼청')||a.includes('율곡'))) return [37.579,126.981];
 if(a.includes('종로구') && a.includes('동숭')) return [37.582,127.003];
 if(a.includes('종로구')) return [37.572,126.982];
 return [37.55,126.98];
}
(async()=>{
 const venues=[...new Map(exhibitions.map(x=>[x.venue+'|'+x.address,{venue:x.venue,address:x.address}])).values()];
 let done=0;
 for(const v of venues){
  const coord=approximateCoord(v);
  if(coord){
   const related=exhibitions.filter(x=>x.venue===v.venue&&x.address===v.address);
   const state=related.every(x=>x.state==='done')?'done':(related.every(x=>x.state==='plan')?'plan':'done');
   const marker=L.marker(coord,{icon:icon(state)}).bindPopup(`<div class="pop-title">${v.venue}</div><div class="pop-small">${related.map(x=>`<b>${x.title}</b><br>~ ${x.end} · ${x.fee} · ${x.rating}`).join('<br><br>')}</div>`);
   marker.addTo(map);related.forEach(x=>markers.push({x,marker}));
   marker.on('click',()=>{active=related[0];render()});
  }
  done++;status.textContent=`지도 표시 ${done}/${venues.length}`;

 }
 status.textContent=`전시 ${exhibitions.length}개 · 장소 ${venues.length}곳`;
 setTimeout(()=>status.style.display='none',2500);
 render();
})();
</script>
